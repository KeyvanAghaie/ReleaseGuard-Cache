[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "releaseguard-cache"
version = "0.1.0"
description = "Exact and semantic caching for deterministic AI provider calls."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
redis = ["redis>=5.2,<6"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
releaseguard-cache = "releaseguard_cache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/releaseguard_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

